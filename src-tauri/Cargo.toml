[package]
name = "autocut-workstation"
version = "0.1.0"
description = "AutoCut Workstation desktop shell"
authors = ["TxShD"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "autocut_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
